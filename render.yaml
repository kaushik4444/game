# One-click deploy on Render (render.com): New + > Blueprint, pick this repo.
services:
  - type: web
    name: tableverse
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Production mode: the server refuses to start without DATABASE_URL, or if the database or a migration fails.
      - key: NODE_ENV
        value: production
      # Render's proxy puts the visitor's address in X-Forwarded-For; used for per-address limits.
      - key: TRUST_PROXY
        value: "1"
      # Postgres (Neon etc.). REQUIRED in production: a missing value makes the deploy fail instead of running on memory.
      - key: DATABASE_URL
        sync: false
      # Optional site-wide notice shown as a dismissible banner on the home screen. Leave empty for none.
      - key: ANNOUNCEMENT
        sync: false
      # Transactional email (verification and password reset). REQUIRED in production: the server refuses to start without them.
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false # e.g. Tableverse <noreply@your-domain>
      - key: PUBLIC_APP_URL
        sync: false # e.g. https://tableverse.onrender.com (used in email links, no trailing slash)
      - key: RESEND_API_KEY
        sync: false
      # Temporary testing switch: set to "false" only when inviting friends before domain-based email delivery is ready.
      # Missing or invalid values default to secure mode ("true").
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      # Optional: where the match-result spool lives (put it on a persistent disk if you have one)
      # - key: MATCH_SPOOL_DIR
